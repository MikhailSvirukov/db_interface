[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
core_app = {path = "../core"}
num = "0.4.3"
num-derive = "0.4.2"
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0"
tokio = { version = "1.38.0", features = ["full"] }
rusqlite = "0.38.0"
axum-macros = "0.5.0"
axum-extra = "0.5.0"
tower-http = { version = "0.5.0", features = ["cors"] }
